<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';"
  />
  <title>Attendance System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="topbar-title">Attendance</span>
      <button id="lock-btn" class="lock-btn hidden" aria-label="Lock admin session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
        <span>Lock</span>
      </button>
    </header>

    <main>
      <section id="tab-kiosk" class="tab-panel active"></section>
      <section id="tab-register" class="tab-panel"></section>
      <section id="tab-employees" class="tab-panel"></section>
      <section id="tab-enroll" class="tab-panel"></section>
      <section id="tab-logs" class="tab-panel"></section>
      <section id="tab-timesheet" class="tab-panel"></section>
    </main>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="kiosk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11c0 3.5-.6 6.5-2.3 9"/><path d="M8 20c1.4-2.2 2-4.8 2-8a2 2 0 1 1 4 0c0 1 0 2-.1 3"/><path d="M5 19c1.6-2.8 2.3-5.9 2.3-9a4.7 4.7 0 1 1 9.4 0c0 .8 0 1.6-.1 2.4"/><path d="M16.3 17.8c.5-1.5.7-3 .7-4.8"/><path d="M4 4.6A9.9 9.9 0 0 1 12 2a9.9 9.9 0 0 1 8 4.6"/></svg>
        <span>Kiosk</span>
      </button>
      <button class="tab-btn" data-tab="register">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.6 2.6-6 5.5-6s5.5 2.4 5.5 6"/><path d="M18.5 8.5v5M16 11h5"/></svg>
        <span>Register</span>
      </button>
      <button class="tab-btn" data-tab="employees">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"/><path d="M2.8 19.5c0-3.3 2.5-5.7 5.7-5.7s5.7 2.4 5.7 5.7"/><circle cx="16.5" cy="8.5" r="2.4"/><path d="M15 13.4c2.6.4 4.5 2.4 4.7 5.3"/></svg>
        <span>Employees</span>
      </button>
      <button class="tab-btn" data-tab="enroll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18c1-1.8 1.5-3.7 1.5-6a2 2 0 1 1 4 0"/><path d="M6.3 17c1.2-2.4 1.7-4.8 1.7-7a4.5 4.5 0 0 1 6-4.2"/><path d="M3.7 5A9 9 0 0 1 12 1"/><path d="M18 15v5M15.5 17.5h5"/></svg>
        <span>Enroll</span>
      </button>
      <button class="tab-btn" data-tab="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12.5" r="8.5"/><path d="M12 7.5v5l3.5 2"/></svg>
        <span>Logs</span>
      </button>
      <button class="tab-btn" data-tab="timesheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17"/><path d="M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/></svg>
        <span>Timesheet</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
